        const mergeData = (savedData) => {
            return {
                ...defaultData,
                ...savedData,
                resume: savedData.resume || defaultData.resume,
                about: savedData.about || defaultData.about,
                hero: savedData.hero || defaultData.hero,
                aiWorkflow: savedData.aiWorkflow || defaultData.aiWorkflow
            };
        };

        // 核心剥离：把聚光灯背景抽出为一个独立的组件，确保它追踪鼠标时，不会强制刷新文字输入框！
        const BackgroundGlow = () => {
            const [mousePosition, setMousePosition] = useState({ x: 0, y: 0 });

            useEffect(() => {
                let animationFrameId;
                const handleMouseMove = (e) => {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = requestAnimationFrame(() => {
                        setMousePosition({ x: e.clientX, y: e.clientY });
                    });
                };
                window.addEventListener('mousemove', handleMouseMove);
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return (
                <div 
                    className="pointer-events-none fixed inset-0 z-0 transition-opacity duration-300"
                    style={{ background: `radial-gradient(circle 800px at ${mousePosition.x}px ${mousePosition.y}px, rgba(163, 78, 36, 0.12), transparent 70%)` }} 
                />
            );
        };

        const EditableText = ({ text, isEditing, onChange, tagName = 'div', className = '', style = {} }) => {
            const Tag = tagName;
            const handleBlur = (e) => {
                let newText = e.target.innerText;
                // 即使完全删空，也保留一个空格，防止节点崩溃
                if (!newText || newText.trim() === '') {
                    newText = ' ';
                }
                if(onChange) onChange(newText);
            };
            return (
                <Tag 
                    className={`${className} ${isEditing ? 'border border-dashed border-[#a34e24] bg-white/5 cursor-text px-1 rounded min-h-[1.5em]' : ''} transition-all`}
                    contentEditable={isEditing}
                    suppressContentEditableWarning={true}
                    onBlur={handleBlur}
                    onClick={(e) => { if(isEditing) e.stopPropagation(); }}
                    style={{ whiteSpace: 'pre-line', ...style }}
                    dangerouslySetInnerHTML={{ __html: text || ' ' }}
                />
            );
        };

        const EditableImage = ({ src, isEditing, onChange, className = '', imgClassName = '', style = {} }) => {
            const fileRef = useRef(null);
            
            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            
                            // 升级压缩算法：同时限制宽和高，防止室内竖向长图导致体积过大
                            const MAX_DIMENSION = 1200;
                            if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
                                if (width > height) {
                                    height = Math.round((height * MAX_DIMENSION) / width);
                                    width = MAX_DIMENSION;
                                } else {
                                    width = Math.round((width * MAX_DIMENSION) / height);
                                    height = MAX_DIMENSION;
                                }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            // 强制使用 JPEG 以避免部分苹果设备不支持 WebP 时回退到体积巨大的 PNG
                            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);
                            if(onChange) onChange(compressedBase64);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className={`relative ${className}`}>
                    <img src={src} className={imgClassName} alt="Portfolio Asset" style={style} />
                    {isEditing && (
                        <div 
                            className="absolute inset-0 bg-black/60 flex items-center justify-center cursor-pointer hover:bg-black/80 transition-all border-2 border-dashed border-[#a34e24] z-10 group rounded-sm"
                            onClick={(e) => { e.stopPropagation(); fileRef.current.click(); }}
                        >

                                点击更换图片<br/><span className="text-[10px] opacity-70">移动端 JPEG 极速压缩</span>
                            </span>
                            <input type="file" hidden accept="image/*" ref={fileRef} onChange={handleFileChange} />
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            // 初始状态先挂载默认数据

                    setCurrentView(view);
                    window.scrollTo(0, 0);
                    setIsLoaded(true);

                const a = document.createElement('a');
                a.href = url;
                a.download = 'data.js';
                a.click();

                <React.Fragment>
                    <section className="relative h-[80vh] flex flex-col justify-center items-center px-8 text-center mt-[-5vh]">
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3/4 h-[2px] opacity-30 blur-md" style={{ backgroundColor: ACCENT_COLOR }}></div>
                        
                        <div className="space-y-6 relative z-10 flex flex-col items-center">
                            <EditableText tagName="p" className="text-[10px] md:text-xs tracking-[0.4em] text-gray-400 uppercase text-center" isEditing={isEditingMode} text={data.hero.subtitleTop} onChange={(val) => updateHero('subtitleTop', val)} />
                            <h1 className="text-5xl md:text-7xl lg:text-9xl font-light tracking-[0.2em] md:tracking-[0.3em] text-white uppercase ml-[0.2em] md:ml-[0.3em]">
                                <EditableText tagName="span" className="block" isEditing={isEditingMode} text={data.hero.titleLine1} onChange={(val) => updateHero('titleLine1', val)} />
                                <EditableText tagName="span" className="text-3xl md:text-5xl lg:text-7xl text-gray-300 tracking-[0.4em] block mt-4" isEditing={isEditingMode} text={data.hero.titleLine2} onChange={(val) => updateHero('titleLine2', val)} />
                            </h1>
                            <div className="flex items-center justify-center gap-4 mt-8">
                                <div className="h-[1px] w-8" style={{ backgroundColor: ACCENT_COLOR }}></div>
                                <EditableText tagName="p" className="text-[10px] md:text-xs tracking-[0.3em] text-gray-500 uppercase text-center" isEditing={isEditingMode} text={data.hero.subtitleBottom} onChange={(val) => updateHero('subtitleBottom', val)} />
                                <div className="h-[1px] w-8" style={{ backgroundColor: ACCENT_COLOR }}></div>
                            </div>
                        </div>
                    </section>

                    <section id="work" className="px-4 md:px-12 py-24 border-t border-gray-900">
                        {isEditingMode && <div className="text-center text-[#a34e24] mb-8 tracking-widest text-sm animate-pulse">【编辑模式：点击图片可替换，点击文字即可修改】</div>}
                        
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 max-w-[1440px] mx-auto">
                            {data.projects.map((project) => (
                                <div key={project.id} onClick={() => navigateTo('project', project)} className="group relative h-[35vh] md:h-[45vh] overflow-hidden cursor-pointer bg-gray-900 border border-transparent hover:border-[#a34e24]/30 transition-all rounded-sm">
                                    <div className="absolute inset-0 bg-[#a34e24] opacity-0 group-hover:opacity-20 transition-opacity duration-700 mix-blend-color z-10 pointer-events-none"></div>
                                    
                                    <EditableImage src={project.image} isEditing={isEditingMode} onChange={(val) => updateProject(project.id, 'image', val)} className="absolute inset-0 w-full h-full z-0" imgClassName="w-full h-full object-cover opacity-40 group-hover:opacity-80 group-hover:scale-105 transition-all duration-1000 mix-blend-luminosity group-hover:mix-blend-normal" />
                                    
                                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent opacity-90 group-hover:opacity-60 transition-opacity duration-700 z-20 pointer-events-none"></div>
                                    
                                    <div className="absolute inset-0 p-6 flex flex-col justify-between z-30 pointer-events-none">
                                        <div className="flex justify-between items-start text-xs tracking-[0.2em] text-gray-400 transform translate-y-4 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-500 delay-100">
                                            <span style={{ color: ACCENT_COLOR }}>{project.id}</span>
                                            <span className="pointer-events-auto relative z-40"><EditableText text={project.category} isEditing={isEditingMode} onChange={(val) => updateProject(project.id, 'category', val)} /></span>
                                        </div>
                                        <div className="transform translate-y-4 group-hover:translate-y-0 transition-transform duration-500 pointer-events-auto relative z-40">
                                            <EditableText tagName="h3" className="text-lg md:text-xl font-light tracking-[0.1em] text-white mb-2 uppercase" text={project.title} isEditing={isEditingMode} onChange={(val) => updateProject(project.id, 'title', val)} />
                                            <div className="h-0 group-hover:h-16 overflow-hidden transition-all duration-500 ease-in-out">
                                                <EditableText tagName="p" className="text-xs text-gray-400 leading-relaxed mt-3 line-clamp-2" text={project.description} isEditing={isEditingMode} onChange={(val) => updateProject(project.id, 'description', val)} />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    <section id="ai-workflow" className="py-32 px-8 md:px-12 bg-[#030303] border-t border-gray-900 relative overflow-hidden">
                        <div className="absolute inset-0 tech-grid-bg opacity-[0.15] pointer-events-none"></div>
                        <div className="relative z-10 flex flex-col md:flex-row justify-between items-end mb-20 gap-12 max-w-[1440px] mx-auto">
                            <div className="w-full md:w-1/2">
                                <EditableText tagName="h2" className="text-3xl md:text-5xl font-light tracking-[0.2em] text-white uppercase" text={data.aiWorkflow.title} isEditing={isEditingMode} onChange={(val) => updateAiWorkflow('title', val)} />
                                <EditableText tagName="p" className="text-xs md:text-sm tracking-[0.3em] mt-4 uppercase" style={{ color: ACCENT_COLOR }} text={data.aiWorkflow.subtitle} isEditing={isEditingMode} onChange={(val) => updateAiWorkflow('subtitle', val)} />
                                <div className="w-16 h-[1px] mt-8" style={{ backgroundColor: ACCENT_COLOR }}></div>
                            </div>
                            <div className="w-full md:w-1/2">
                                <EditableText tagName="p" className="text-sm md:text-base tracking-[0.1em] text-gray-400 font-light leading-loose" text={data.aiWorkflow.description} isEditing={isEditingMode} onChange={(val) => updateAiWorkflow('description', val)} />
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 relative z-10 max-w-[1440px] mx-auto">
                            {data.aiWorkflow.tools.map((tool, idx) => (
                                <div key={tool.id} className="p-10 border border-gray-800 bg-[#0a0a0a]/80 backdrop-blur-sm hover:border-[#a34e24]/50 transition-all duration-500 group relative overflow-hidden rounded-sm">
                                    <div className="absolute top-0 left-0 w-full h-[2px] bg-[#a34e24] transform -translate-x-full group-hover:translate-x-0 transition-transform duration-700"></div>
                                    <div className="text-[10px] tracking-[0.3em] mb-8 font-bold" style={{ color: ACCENT_COLOR }}>PHASE 0{tool.id}</div>
                                    <EditableText tagName="h3" className="text-lg md:text-xl text-gray-200 tracking-[0.1em] mb-4 uppercase font-light" text={tool.name} isEditing={isEditingMode} onChange={(val) => updateAiTool(idx, 'name', val)} />
                                    <EditableText tagName="p" className="text-sm text-gray-500 leading-relaxed tracking-[0.05em]" text={tool.desc} isEditing={isEditingMode} onChange={(val) => updateAiTool(idx, 'desc', val)} />
                                </div>
                            ))}
                        </div>
                    </section>

                    <section id="about" className="pt-32 pb-16 px-8 md:px-24 flex flex-col md:flex-row items-center gap-16 relative border-t border-gray-900 max-w-[1440px] mx-auto">
                        <div className="w-full md:w-1/2 relative">
                            <div className="aspect-square bg-gray-900 rounded-full absolute -top-10 -left-10 w-full h-full blur-3xl opacity-20"></div>
                            <EditableImage src={data.about.portrait || "https://images.unsplash.com/photo-1497366754035-f200968a6e72?q=80&w=1000&auto=format&fit=crop"} isEditing={isEditingMode} onChange={(val) => updateAbout('portrait', val)} className="w-full h-auto object-cover relative z-10" imgClassName="w-full h-auto object-cover grayscale contrast-150 brightness-75 rounded-sm" style={{ clipPath: 'polygon(10% 0, 100% 0, 90% 100%, 0 100%)' }} />
                            <div className="absolute top-0 right-10 w-1/2 h-full bg-gradient-to-l from-[#a34e24]/20 to-transparent blur-xl z-20 pointer-events-none transform skew-x-12"></div>
                        </div>
                        <div className="w-full md:w-1/2 space-y-8 z-30 relative pointer-events-auto">
                            <EditableText tagName="h2" className="text-3xl md:text-5xl font-light tracking-[0.2em] text-white uppercase" text={data.about.title} isEditing={isEditingMode} onChange={(val) => updateAbout('title', val)} />
                            <div className="w-12 h-[1px] bg-[#a34e24]"></div>
                            <EditableText tagName="p" className="text-gray-400 text-sm md:text-base leading-loose font-light" text={data.about.p1} isEditing={isEditingMode} onChange={(val) => updateAbout('p1', val)} />
                            <EditableText tagName="p" className="text-gray-500 text-sm md:text-base leading-loose font-light" text={data.about.p2} isEditing={isEditingMode} onChange={(val) => updateAbout('p2', val)} />
                        </div>
                    </section>

                    <section id="resume" className="pb-32 px-8 md:px-24 max-w-[1440px] mx-auto w-full relative z-40 pointer-events-auto">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-12 pt-16 border-t border-gray-800/50">
                            <div className="space-y-6 relative z-50 pointer-events-auto">
                                <EditableText tagName="h3" className="text-2xl md:text-3xl font-light text-white tracking-[0.1em] pointer-events-auto" text={data.resume.name} isEditing={isEditingMode} onChange={(val) => updateResume('name', val)} />
                                <EditableText tagName="div" className="text-sm tracking-[0.2em] uppercase pointer-events-auto" style={{ color: ACCENT_COLOR }} text={data.resume.title} isEditing={isEditingMode} onChange={(val) => updateResume('title', val)} />
                                <div className="space-y-2 mt-8 text-sm text-gray-500 font-light tracking-[0.05em] pointer-events-auto">
                                    <EditableText tagName="div" className="pointer-events-auto" text={data.resume.contactPhone} isEditing={isEditingMode} onChange={(val) => updateResume('contactPhone', val)} />
                                    <EditableText tagName="div" className="pointer-events-auto" text={data.resume.contactEmail} isEditing={isEditingMode} onChange={(val) => updateResume('contactEmail', val)} />
                                </div>
                            </div>
                            
                            <div className="space-y-10 relative z-50 pointer-events-auto">
                                <div>
                                    <EditableText tagName="div" className="text-[10px] tracking-[0.3em] text-gray-600 mb-4 font-bold pointer-events-auto" text={data.resume.eduTitle} isEditing={isEditingMode} onChange={(val) => updateResume('eduTitle', val)} />
                                    <EditableText tagName="div" className="text-sm text-gray-300 leading-relaxed font-light tracking-wide pointer-events-auto" text={data.resume.eduDetail} isEditing={isEditingMode} onChange={(val) => updateResume('eduDetail', val)} />
                                </div>
                                <div>
                                    <EditableText tagName="div" className="text-[10px] tracking-[0.3em] text-gray-600 mb-4 font-bold pointer-events-auto" text={data.resume.expTitle} isEditing={isEditingMode} onChange={(val) => updateResume('expTitle', val)} />
                                    <EditableText tagName="div" className="text-sm text-gray-300 leading-relaxed font-light tracking-wide pointer-events-auto" text={data.resume.expDetail} isEditing={isEditingMode} onChange={(val) => updateResume('expDetail', val)} />
                                </div>
                            </div>

                            <div className="space-y-10 relative z-50 pointer-events-auto">
                                <div>
                                    <EditableText tagName="div" className="text-[10px] tracking-[0.3em] text-gray-600 mb-4 font-bold pointer-events-auto" text={data.resume.skillsTitle} isEditing={isEditingMode} onChange={(val) => updateResume('skillsTitle', val)} />
                                    <EditableText tagName="div" className="text-sm text-gray-300 leading-loose font-light tracking-wide pointer-events-auto" text={data.resume.skillsDetail} isEditing={isEditingMode} onChange={(val) => updateResume('skillsDetail', val)} />
                                </div>
                            </div>
                        </div>
                    </section>
                </React.Fragment>
            );

            const renderProjectDetail = () => {
                if (!activeProject) return null;
                const project = data.projects.find(p => p.id === activeProject.id);
                if (!project) return null;

                return (
                    <div className="pb-32 transition-all duration-1000">
                        <section className="relative h-[80vh] flex flex-col justify-end p-8 md:p-24 overflow-hidden">
                            <div className="absolute inset-0 z-0">
                                <EditableImage src={project.image} isEditing={isEditingMode} onChange={(val) => updateProject(project.id, 'image', val)} className="w-full h-full" imgClassName="w-full h-full object-cover grayscale-[40%] contrast-125" />
                                <div className="absolute inset-0 bg-gradient-to-t from-black via-black/80 to-black/20 pointer-events-none z-10"></div>
                            </div>
                            <div className="relative z-30 max-w-[1440px] w-full mx-auto pointer-events-auto">
                                <div className="flex items-center gap-4 mb-6">
                                    <span className="text-xs tracking-[0.3em]" style={{ color: ACCENT_COLOR }}>PROJECT NO.{project.id}</span>
                                    <div className="h-[1px] w-12 bg-gray-600"></div>
                                    <EditableText tagName="span" className="text-xs tracking-[0.2em] text-gray-400 uppercase" text={project.category} isEditing={isEditingMode} onChange={(val) => updateProject(project.id, 'category', val)} />
                                </div>
                                <EditableText tagName="h1" className="text-5xl md:text-8xl font-light tracking-[0.1em] text-white uppercase mb-8" text={project.title} isEditing={isEditingMode} onChange={(val) => updateProject(project.id, 'title', val)} />
                            </div>
                        </section>

                        <section className="px-8 md:px-24 py-24 flex flex-col md:flex-row gap-16 md:gap-32 max-w-[1440px] mx-auto">
                            <div className="w-full md:w-1/4 space-y-12 shrink-0">
                                <div>
                                    <div className="text-[10px] tracking-[0.2em] text-gray-500 mb-2">ROLE</div>
                                    <EditableText tagName="div" className="text-sm tracking-[0.1em] text-gray-200 uppercase" text={project.role} isEditing={isEditingMode} onChange={(val) => updateProject(project.id, 'role', val)} />
                                    <div className="w-full h-[1px] bg-gray-900 mt-4"></div>
                                </div>
                                <div>
                                    <div className="text-[10px] tracking-[0.2em] text-gray-500 mb-2">YEAR</div>
                                    <EditableText tagName="div" className="text-sm tracking-[0.1em] text-gray-200 uppercase" text={project.year} isEditing={isEditingMode} onChange={(val) => updateProject(project.id, 'year', val)} />
                                    <div className="w-full h-[1px] bg-gray-900 mt-4"></div>
                                </div>
                                <div>
                                    <div className="text-[10px] tracking-[0.2em] text-gray-500 mb-2">CLIENT</div>
                                    <EditableText tagName="div" className="text-sm tracking-[0.1em] text-gray-200 uppercase" text={project.client} isEditing={isEditingMode} onChange={(val) => updateProject(project.id, 'client', val)} />
                                    <div className="w-full h-[1px] bg-gray-900 mt-4"></div>
                                </div>
                                {!isEditingMode && (
                                    <button onClick={() => navigateTo('home')} className="mt-16 text-xs tracking-[0.2em] uppercase border px-6 py-3 hover:bg-white hover:text-black transition-all duration-300 flex items-center gap-4" style={{ borderColor: ACCENT_COLOR, color: ACCENT_COLOR }}>
                                        <span>←</span> BACK TO LIST
                                    </button>
                                )}
                            </div>

                            <div className="w-full md:w-3/4 space-y-24">
                                <div>
                                    <h3 className="text-2xl tracking-[0.2em] text-white uppercase mb-8">Design Scope</h3>
                                    <EditableText tagName="p" className="text-base md:text-lg text-gray-400 leading-relaxed font-light" text={project.fullDescription} isEditing={isEditingMode} onChange={(val) => updateProject(project.id, 'fullDescription', val)} />
                                </div>

                                <div className="space-y-8">
                                    {project.detailImages.map((img, idx) => (
                                        <div key={idx} className="relative group overflow-hidden rounded-sm">
                                            <div className="absolute inset-0 opacity-0 group-hover:opacity-20 transition-opacity duration-1000 mix-blend-overlay pointer-events-none z-10" style={{ backgroundColor: ACCENT_COLOR }}></div>
                                            <EditableImage src={img} isEditing={isEditingMode} onChange={(val) => updateProjectDetailImage(project.id, idx, val)} className="w-full relative z-0" imgClassName="w-full h-auto object-cover grayscale-[20%] hover:grayscale-0 transition-all duration-1000" />
                                        </div>
                                    ))}
                                    {isEditingMode && (
                                        <div 
                                            className="w-full h-64 border-2 border-dashed border-gray-700 hover:border-[#a34e24] flex items-center justify-center cursor-pointer transition-colors"
                                            onClick={() => {
                                                const input = document.createElement('input');
                                                input.type = 'file';
                                                input.accept = 'image/*';
                                                input.onchange = (e) => {
                                                    const file = e.target.files[0];
                                                    if (file) {
                                                        const reader = new FileReader();
                                                        reader.onload = (event) => {
                                                            const img = new Image();
                                                            img.onload = () => {
                                                                const canvas = document.createElement('canvas');
                                                                let width = img.width; let height = img.height;
                                                                const MAX_WIDTH = 1080;
                                                                if (width > MAX_WIDTH) {
                                                                    height = Math.round((height * MAX_WIDTH) / width);
                                                                    width = MAX_WIDTH;
                                                                }
                                                                canvas.width = width; canvas.height = height;
                                                                const ctx = canvas.getContext('2d');
                                                                ctx.drawImage(img, 0, 0, width, height);
                                                                const compressedBase64 = canvas.toDataURL('image/webp', 0.6);
                                                                const newImages = [...project.detailImages, compressedBase64];
                                                                updateProject(project.id, 'detailImages', newImages);
                                                            };
                                                            img.src = event.target.result;
                                                        };
                                                        reader.readAsDataURL(file);
                                                    }
                                                };
                                                input.click();
                                            }}
                                        >
                                            <span className="text-gray-500 tracking-widest text-center">+ 添加新图纸/效果图 <br/><span className="text-[10px]">自动压缩排版</span></span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </section>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-black text-gray-200 font-sans selection:bg-[#a34e24] selection:text-white overflow-x-hidden relative">
                    <BackgroundGlow />

                    {showPasswordModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm">
                            <div className="bg-[#111] border border-gray-800 p-8 rounded max-w-sm w-full shadow-2xl animate-fade-in-down">
                                <h3 className="text-white text-sm tracking-[0.2em] mb-6 uppercase border-b border-gray-800 pb-2">Access Control</h3>
                                <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} className="w-full bg-black border border-gray-700 text-white p-3 mb-6 focus:outline-none focus:border-[#a34e24] transition-colors text-sm tracking-widest" placeholder="请输入编辑密码..." onKeyDown={(e) => e.key === 'Enter' && handlePasswordSubmit()} autoFocus />
                                <div className="flex justify-end gap-4">
                                    <button onClick={() => setShowPasswordModal(false)} className="text-gray-500 hover:text-white px-4 py-2 text-xs tracking-widest uppercase transition-colors">Cancel</button>
                                    <button onClick={handlePasswordSubmit} className="bg-[#a34e24] hover:bg-[#8a421e] text-white px-6 py-2 text-xs tracking-widest uppercase transition-colors">Confirm</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {alertMessage && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[100] bg-[#a34e24] text-white px-6 py-3 shadow-2xl tracking-[0.1em] text-sm animate-fade-in-down border border-[#c46536] rounded-sm text-center">
                            {alertMessage}
                        </div>
                    )}

                    <div className={`relative z-10 transition-opacity duration-1000 ${isLoaded ? 'opacity-100' : 'opacity-0'}`}>
                        <Navigation />
                        {currentView === 'home' ? <HomeView /> : renderProjectDetail()}

                        <footer id="contact" className="py-24 px-8 text-center flex flex-col items-center justify-center border-t border-gray-900 relative overflow-hidden mt-24">
                            <div className="absolute bottom-0 left-1/2 -translate-x-1/2 w-full h-64 bg-gradient-to-t from-[#a34e24]/10 to-transparent blur-[100px] pointer-events-none rounded-t-[100%]"></div>
                            <div className="z-10 flex flex-col items-center space-y-8">
                                <div className="text-2xl tracking-[0.3em] font-light text-white">C O N T A C T</div>
                                <a href="mailto:design@studio.com" className="text-sm tracking-[0.1em] text-gray-400 hover:text-white transition-colors border-b border-gray-800 pb-1 hover:border-[#a34e24]">DESIGN@STUDIO.SPACE</a>
                                <div className="mt-16 text-[10px] tracking-[0.2em] text-gray-700 uppercase">© {new Date().getFullYear()} Interior Architecture. Crafted by Space & Light.</div>
                            </div>
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
